services:
  postgres:
    # Pinned to 17 to match the deployed Supabase instance (17.6). Testing
    # on 18 while production runs 17 risks behaviour that passes locally
    # and fails live — or the reverse. Bump this only together with the
    # production database.
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: regive
      POSTGRES_USER: regive
      POSTGRES_PASSWORD: regive
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U regive -d regive']
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:8-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  redis-data:
