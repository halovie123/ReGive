services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: regive
      POSTGRES_USER: regive
      POSTGRES_PASSWORD: regive
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U regive -d regive']
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:8-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  redis-data:
