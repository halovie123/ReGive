# Keeps the free-tier Supabase project from being paused and doubles as an
# uptime check.
#
# Supabase pauses a free project after a week without enough database
# activity; on 2026-10-04 that took sign-in and every signed-in page down.
# GET /v1/ready runs SELECT 1 against the database (and wakes the Render
# instance, whose cold start was measured at 42s, hence the long timeout).
# A failed run means the API or the database is down; GitHub emails the
# repository owner about failed scheduled runs.
#
# Scheduled workflows only run from the default branch, and GitHub disables
# them after 60 days without repository activity.
name: Keep alive

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check API readiness (database included)
        env:
          READY_URL: https://regive-llw3.onrender.com/v1/ready
        run: |
          curl --fail --silent --show-error \
            --retry 3 --retry-delay 20 --retry-all-errors \
            --max-time 120 \
            "$READY_URL"
