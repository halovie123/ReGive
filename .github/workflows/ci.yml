name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Matches the deployed Supabase instance (17.6) and
        # infra/docker-compose.yml. Keep all three in step.
        image: postgres:17-alpine
        env:
          POSTGRES_DB: regive_identity_ci
          POSTGRES_USER: regive
          POSTGRES_PASSWORD: regive
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U regive -d regive_identity_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply identity migrations to isolated CI database
        run: pnpm --filter api exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://regive:regive@127.0.0.1:5432/regive_identity_ci
      - name: Verify database-backed identity and profile invariants
        run: pnpm --filter api test:e2e:db
        env:
          RUN_DATABASE_TESTS: "true"
          TEST_DATABASE_URL: postgresql://regive:regive@127.0.0.1:5432/regive_identity_ci
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Verify infra-free API e2e suite (release gate)
        run: pnpm --filter api test:e2e
      - name: Install Playwright browser
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Verify web e2e suite
        run: pnpm --filter web test:e2e
      - run: pnpm build
      # Every other gate above passes on an API that cannot start: a NodeNext
      # module-resolution bug once shipped through lint, typecheck, 75 unit
      # tests, every e2e suite and `nest build` while `node dist/src/main.js`
      # died on boot. Nothing started the process. This does.
      - name: Verify the built API actually boots and serves /v1/health
        run: pnpm --filter api smoke
        env:
          NODE_ENV: development
          SMOKE_PORT: "3001"
          DATABASE_URL: postgresql://regive:regive@127.0.0.1:5432/regive_identity_ci
          REDIS_URL: redis://127.0.0.1:6379
          SUPABASE_URL: https://smoke.example.supabase.co
          SUPABASE_JWKS_URL: https://smoke.example.supabase.co/auth/v1/.well-known/jwks.json
          SUPABASE_ANON_KEY: smoke-anon-key
